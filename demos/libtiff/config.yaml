# Restricts harness synthesis to exactly the API surface Traffic's
# examples/libtiff/libtiff.tf targets: tiff_open_r, tiff_open_w,
# tiff_fuzz_read_strip, tiff_fuzz_read_rgba, tiff_fuzz_write_strip
# (tiff-support.h), and TIFFClose, TIFFSetField, TIFFWriteDirectory
# (tiffio.h). Everything else declared in those two headers -- including the
# tiff_src_*/tiff_dst_* internal TIFFClientOpen callbacks in
# tiff-support.h -- is blacklisted.
blacklist:
- LogL10fromY
- LogL10toY
- LogL16fromY
- LogL16toY
