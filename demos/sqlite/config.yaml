# Opt-in whitelist: exactly the API surface Traffic's
# examples/sqlite3/sqlite3.tf targets. Everything else declared in
# sqlite3.h is dropped, same as if it were blacklisted.
whitelist:
- sqlite3_open
- sqlite3_close
- sqlite3_limit
- sqlite3_prepare_v2
- sqlite3_finalize
- sqlite3_step
- sqlite3_reset

preamble_seq:
- sqlite3_open

arg_keys:
  sqlite3_open:
    - {"index": 0, "value": "\":memory:\""} # 0th arg to sqlite3_open should be ":memory:" to avoid filesystem overhead
