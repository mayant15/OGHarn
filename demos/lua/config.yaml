# Opt-in whitelist: exactly the API surface Traffic's
# examples/lua/lua.tf targets -- luaL_newstate, luaL_loadbufferx (lauxlib.h);
# lua_close, lua_pcallk (the real declared function behind the lua_pcall
# macro), lua_gettop, lua_settop, lua_checkstack, lua_pushnil,
# lua_pushinteger, lua_pushboolean, lua_tolstring (lua.h). Everything else
# declared in those two headers is dropped, same as if it were blacklisted.
whitelist:
- luaL_newstate
- luaL_loadbufferx
- lua_close
- lua_pcallk
- lua_gettop
- lua_settop
- lua_checkstack
- lua_pushnil
- lua_pushinteger
- lua_pushboolean
- lua_tolstring
