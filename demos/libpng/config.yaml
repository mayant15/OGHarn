# Opt-in whitelist: exactly the API surface Traffic's
# examples/libpng/libpng.tf targets -- png_fuzz_new_image, png_fuzz_free_image
# (png-support.h) and the simplified (png_image_*) memory-buffer read API
# (png.h). Everything else declared in the -h headers is dropped, same as if
# it were blacklisted.
whitelist:
- png_image_begin_read_from_memory
- png_image_finish_read
- png_image_free
- png_fuzz_new_image
- png_fuzz_free_image
