# Restricts harness synthesis to exactly the API surface Traffic's
# examples/libxml2/libxml2.tf targets: xmlFree (libxml/globals.h); xmlNewDoc,
# xmlFreeDoc, xmlCopyDoc, xmlNewNode, xmlFreeNode, xmlAddChild, xmlUnlinkNode,
# xmlDocGetRootElement, xmlChildElementCount, xmlNodeIsText, xmlIsBlankNode,
# xmlNodeGetContent, xmlGetProp, xmlHasProp (libxml/tree.h); xmlInitParser,
# xmlNewParserCtxt, xmlFreeParserCtxt, xmlCtxtReadMemory (libxml/parser.h);
# xmlParserInputBufferCreateStatic, xmlFreeParserInputBuffer
# (libxml/xmlIO.h); and xmlNewTextReader, xmlFreeTextReader,
# xmlTextReaderRead, xmlTextReaderNodeType, xmlTextReaderDepth,
# xmlTextReaderIsEmptyElement, xmlTextReaderConstName (libxml/xmlreader.h).
# Everything else declared in those five headers is blacklisted. run_ogharn.sh
# passes all five headers via -h so Multiplier indexes declarations from all
# of them, not just parser.h/xmlreader.h.
blacklist:
- __docbDefaultSAXHandler
- __htmlDefaultSAXHandler
- __oldXMLWDcompatibility
- __xmlBufferAllocScheme
- __xmlDefaultBufferSize
- __xmlDefaultSAXHandler
- __xmlDefaultSAXLocator
- __xmlDeregisterNodeDefaultValue
- __xmlDoValidityCheckingDefaultValue
- __xmlFree
- __xmlGenericError
- __xmlGenericErrorContext
- __xmlGetWarningsDefaultValue
- __xmlIndentTreeOutput
- __xmlKeepBlanksDefaultValue
- __xmlLastError
- __xmlLineNumbersDefaultValue
- __xmlLoadExtDtdDefaultValue
- __xmlMalloc
