# Restricts harness synthesis to exactly the API surface Traffic's
# examples/libsndfile/libsndfile.tf targets: sf_init_file, sf_fuzz_readf_int,
# sf_fuzz_writef_int, sf_fuzz_readf_double, sf_fuzz_writef_double,
# sf_fuzz_get_chunk_iterator, sf_fuzz_get_chunk_data (sndfile-support.h), and
# sf_error, sf_strerror, sf_error_number, sf_close, sf_version_string,
# sf_format_check, sf_current_byterate, sf_seek, sf_get_chunk_iterator,
# sf_next_chunk_iterator, sf_get_chunk_size (sndfile.h). Everything else
# declared in those two headers -- including the sf_fuzz_samples/vf*
# internal VIO-callback helpers in sndfile-support.h -- is blacklisted.
blacklist:
- sf_command
- sf_error_str
- sf_fuzz_samples
- sf_get_chunk_data
- sf_get_string
- sf_open
- sf_open_fd
- sf_open_virtual
- sf_perror
- sf_read_double
- sf_read_float
- sf_read_int
- sf_read_raw
- sf_read_short
- sf_readf_double
- sf_readf_float
- sf_readf_int
- sf_readf_short
- sf_set_chunk
- sf_set_string
- sf_wchar_open
- sf_write_double
- sf_write_float
- sf_write_int
- sf_write_raw
- sf_write_short
- sf_write_sync
- sf_writef_double
- sf_writef_float
- sf_writef_int
- sf_writef_short
- vfget_filelen
- vfread
- vfseek
- vftell
- vfwrite
