# Restricts harness synthesis to exactly the API surface Traffic's
# examples/openssl/openssl.tf targets: d2i_X509, X509_free, X509_STORE_new,
# X509_STORE_add_cert, X509_STORE_free (openssl/x509.h -- note
# X509_STORE_new/_add_cert/_free are actually declared in x509_vfy.h in this
# pinned commit, not x509.h, despite the .tf's `import "openssl/x509.h"`);
# X509_STORE_CTX_new, X509_verify_cert, X509_STORE_CTX_get_error
# (openssl/x509_vfy.h); and x509_fuzz_ctx_init, x509_fuzz_ctx_cleanup,
# x509_fuzz_ctx_free (x509-support.h). Everything else declared in those
# three headers -- including the internal x509_fuzz_ctx_unbind static helper
# in x509-support.h -- is blacklisted. run_ogharn.sh's -h list is narrowed to
# just these three headers: Traffic's spec never touches openssl/ssl.h,
# openssl/asn1.h or openssl/bn.h, which the previous -h list requested.
blacklist:
- ASN1_digest
- ASN1_item_digest
- ASN1_item_sign
- ASN1_item_sign_ctx
- ASN1_item_verify
- ASN1_item_verify_ctx
- ASN1_sign
- ASN1_verify
